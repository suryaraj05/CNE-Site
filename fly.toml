app = 'cne-site-preview'
primary_region = 'lhr'

[build]

[env]
  PORT = '8080'
  # Preview only — remove CNE_NOINDEX when pointing cargonortheast.com at this app.
  CNE_NOINDEX = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
